<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="ClearCourse AI: clear assignment guidance and course conversations." />
    <title>ClearCourse AI</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <a class="uw-logo-link" href="https://uwaterloo.ca/" target="_blank" rel="noopener noreferrer" aria-label="University of Waterloo">
        <img src="uwaterloo-logo.svg" alt="" width="170" height="41" />
      </a>
      <button class="brand-link" type="button" data-view="home">
        <strong>ClearCourse</strong>
        <small>AI guidance, made clear</small>
      </button>
    </header>
    <div class="colour-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Course navigation">
        <div class="sidebar-section-label">Your courses</div>
        <div id="course-nav"></div>
        <div class="sidebar-foot">Sample courses<small>No sign-in or saved data.</small></div>
      </aside>

      <main id="main" class="main-content">
        <header class="topbar"><nav class="crumb" id="crumb" aria-label="Location"></nav></header>
        <div id="view-root"></div>
      </main>
    </div>
    <dialog id="compose-dialog" aria-labelledby="compose-title">
      <form id="question-form" method="dialog" class="dialog-form">
        <div class="dialog-head"><div><div class="eyebrow">START A CONVERSATION</div><h2 id="compose-title">Ask a question</h2></div><button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button></div>
        <p class="dialog-note">This demo keeps questions only until you reload. Real anonymous posting will need the privacy architecture described in the project spec.</p>
        <label for="question-tag">Question about</label><select id="question-tag" name="tag" required></select>
        <label for="question-title">Your question</label><input id="question-title" name="title" maxlength="120" placeholder="What would you like to clarify?" required />
        <label for="question-body">More context <span class="optional">(optional)</span></label><textarea id="question-body" name="body" maxlength="600" rows="5" placeholder="Add context that would help your instructor answer."></textarea>
        <div class="dialog-actions"><button type="button" class="button ghost" data-close-dialog>Cancel</button><button type="submit" class="button primary">Add to demo board</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
